# Local development database only. Production uses a managed MySQL 8.4 instance.
services:
  mysql:
    image: mysql:8.4
    container_name: label-mes-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-devroot}
      MYSQL_DATABASE: label_mes_dev
      MYSQL_USER: label_mes
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-label_mes_dev_pw}
    ports:
      - "3306:3306"
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci", "--log-bin-trust-function-creators=1"]
    volumes:
      - mysql-data:/var/lib/mysql
      - ./server/docker/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-devroot}"]
      interval: 5s
      timeout: 5s
      retries: 30
volumes:
  mysql-data:
